<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  min-height:100dvh;
  display:flex;justify-content:center;align-items:center;
  padding:16px;
  background:#f7e6ef;font-family:Georgia,serif;
  overflow-x:hidden;
}
.carta{
  width:100%;max-width:900px;
  min-height:calc(100dvh - 32px);
  border-radius:28px;
  padding:32px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.15);
  transition:background .6s ease;
  gap:16px;
  position:relative;
  overflow:hidden;
}
.carta.carta-capa{justify-content:center}
.carta.carta-cena{justify-content:center;gap:20px}

.meme-single{
  width:100%;max-width:520px;max-height:50dvh;
  object-fit:contain;border-radius:20px;
}
.cena-gif{
  width:100%;max-width:480px;max-height:44dvh;
  object-fit:contain;border-radius:20px;
}
.letra-pt{
  font-size:clamp(1.15rem,4.2vw,1.8rem);
  font-weight:bold;line-height:1.5;
  max-width:700px;padding:0 8px;letter-spacing:.2px;
}
.letra-en{
  font-size:clamp(.85rem,2.8vw,1.05rem);
  font-style:italic;opacity:.65;line-height:1.5;
  max-width:700px;padding:0 8px;margin-top:-8px;
}
.titulo{font-size:clamp(1.6rem,5.5vw,3rem);margin:8px 0;line-height:1.2}
.texto{font-size:clamp(1rem,3.6vw,1.35rem);line-height:1.7;max-width:700px;padding:0 4px}

.botao{
  margin-top:auto;border:none;background:#d85a9a;color:#fff;
  padding:16px 44px;border-radius:999px;cursor:pointer;
  font-size:1.1rem;font-family:inherit;font-weight:bold;
  transition:transform .15s, background .2s;
  box-shadow:0 6px 20px rgba(216,90,154,.35);
  min-height:52px;touch-action:manipulation;
}
.botao:hover{transform:scale(1.05);background:#c94a8b}
.botao:active{transform:scale(.97)}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.cena-gif,.letra-pt,.letra-en{animation:fadeIn .5s ease both}
.letra-pt{animation-delay:.05s}
.letra-en{animation-delay:.15s}

@media (max-width:600px){
  body{padding:8px}
  .carta{min-height:calc(100dvh - 16px);border-radius:22px;padding:24px 16px 20px;gap:12px}
  .cena-gif{max-height:40dvh;border-radius:16px}
  .meme-single{max-height:45dvh;border-radius:16px}
  .letra-pt{font-size:clamp(1.05rem,5vw,1.4rem)}
  .letra-en{font-size:clamp(.8rem,3.4vw,1rem)}
  .botao{padding:15px 36px;font-size:1rem;min-height:50px;width:100%;max-width:280px}
}
@media (max-width:380px){
  .carta{padding:18px 12px 16px}
  .cena-gif{max-height:36dvh}
  .letra-pt{font-size:1rem}
  .letra-en{font-size:.78rem}
}
@media (max-height:500px) and (orientation:landscape){
  body{padding:6px}
  .carta{min-height:calc(100dvh - 12px);padding:14px 20px;gap:8px;border-radius:16px}
  .cena-gif{max-height:52dvh}
  .letra-pt{font-size:.95rem}
  .letra-en{font-size:.75rem}
  .botao{padding:12px 32px;min-height:44px;font-size:.95rem}
}

/* ============================================================
   ESTADO
   ============================================================ */
let atual = 0;
let musicaIniciada = false;
let rafId = null;

const carta  = document.getElementById("carta");
const area   = document.getElementById("areaGatos");
const titulo = document.getElementById("titulo");
const texto  = document.getElementById("texto");
const btn    = document.getElementById("btn");
const musica = document.getElementById("musica");

musica.volume = 0.5;

/* ============================================================
   RENDER
   ============================================================ */
function carregarCena(i){
  const c = cenas[i];

  titulo.innerHTML = "";
  texto.innerHTML  = "";
  titulo.style.display = "none";
  texto.style.display  = "none";
  carta.classList.remove("carta-cena", "carta-capa");
  carta.style.background = c.bg;

  /* CAPA */
  if(c.tipo === "capa"){
    carta.classList.add("carta-capa");
    area.innerHTML = `<img class="meme-single" src="${c.gif}" alt="">`;
    if(c.titulo){
      titulo.style.display = "";
      titulo.innerHTML = c.titulo;
      titulo.style.color = c.corTexto;
    }
    if(c.texto){
      texto.style.display = "";
      texto.innerHTML = c.texto;
      texto.style.color = c.corTexto;
    }
    if(i === 0){
      btn.style.display = "";
      btn.textContent = "▶ Começar";
    } else {
      btn.style.display = "none"; // encerramento esconde
    }
  }

  /* CENA */
  else {
    carta.classList.add("carta-cena");
    const temLetra = (c.pt && c.pt.trim() !== "");
    area.innerHTML = `
      <img class="cena-gif" src="${c.gif}" alt="">
      ${temLetra ? `<div class="letra-pt" style="color:${c.corTexto}">${c.pt}</div>` : ""}
      ${c.en ? `<div class="letra-en" style="color:${c.corTexto}">${c.en}</div>` : ""}
    `;
    btn.style.display = "none";
  }
}

/* ============================================================
   LOOP DE SINCRONIZAÇÃO — usa o currentTime da música
   ============================================================ */
function tick(){
  if(!musicaIniciada){ rafId = requestAnimationFrame(tick); return; }

  const tempo = musica.currentTime;

  /* Acha a última cena cujo `t` <= tempo atual.
     Só consideramos cenas com `t` definido (a capa inicial e o
     encerramento não têm `t`, então ficam de fora do loop). */
  let alvo = atual;

  for(let i = 1; i < cenas.length - 1; i++){
    const c = cenas[i];
    if(c.t !== undefined && c.t <= tempo){
      alvo = i;
    } else {
      break;
    }
  }

  if(alvo !== atual){
    atual = alvo;
    carregarCena(atual);
  }

  rafId = requestAnimationFrame(tick);
}

/* ============================================================
   FIM DA MÚSICA → vai pro gatinho estrelado
   ============================================================ */
musica.addEventListener("ended", () => {
  if(rafId) cancelAnimationFrame(rafId);
  atual = cenas.length - 1;
  carregarCena(atual);
});

/* ============================================================
   CLIQUE DO BOTÃO
   ============================================================ */
btn.onclick = () => {
  if(!musicaIniciada){
    musicaIniciada = true;
    musica.volume = 0.5;
    const p = musica.play();
    if(p && p.catch) p.catch(e => console.warn("play() falhou:", e));

    /* Já começa na primeira cena sincronizada (t=0) */
    atual = 1;
    carregarCena(1);

    /* Inicia o loop de sincronização */
    rafId = requestAnimationFrame(tick);
    return;
  }
};

/* ============================================================
   START
   ============================================================ */
carregarCena(0);
