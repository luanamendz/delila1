<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7e6ef">
<title>💌 Do Jeito Que Você É</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  min-height:100dvh;display:flex;justify-content:center;align-items:center;
  padding:16px;background:#f7e6ef;font-family:Georgia,serif;overflow-x:hidden;
}
.carta{
  width:100%;max-width:900px;min-height:calc(100dvh - 32px);
  border-radius:28px;padding:32px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.15);
  transition:background .6s ease;gap:16px;position:relative;overflow:hidden;
}
.carta.carta-capa{justify-content:center}
.carta.carta-cena{justify-content:center;gap:18px}

.meme-single{width:100%;max-width:520px;max-height:50dvh;object-fit:contain;border-radius:20px}
.cena-gif{width:100%;max-width:480px;max-height:44dvh;object-fit:contain;border-radius:20px}

/* container de vários gifs lado a lado */
.gifs-row{
  display:flex;flex-wrap:wrap;gap:12px;
  justify-content:center;align-items:center;width:100%;
}
.gifs-row img{
  flex:1 1 auto;
  object-fit:contain;border-radius:18px;
  max-height:40dvh;
}
.gifs-row.dupla img{max-width:calc(50% - 6px)}
.gifs-row.tripla img{max-width:calc(33.33% - 8px);max-height:32dvh}
.gifs-row.quadrupla img{max-width:calc(50% - 6px);max-height:28dvh}

.letra-pt{font-size:clamp(1.15rem,4.2vw,1.8rem);font-weight:bold;line-height:1.5;max-width:700px;padding:0 8px;letter-spacing:.2px}
.letra-en{font-size:clamp(.85rem,2.8vw,1.05rem);font-style:italic;opacity:.65;line-height:1.5;max-width:700px;padding:0 8px;margin-top:-8px}
.titulo{font-size:clamp(1.6rem,5.5vw,3rem);margin:8px 0;line-height:1.2}
.texto{font-size:clamp(1rem,3.6vw,1.35rem);line-height:1.7;max-width:700px;padding:0 4px}
.botao{
  margin-top:auto;border:none;background:#d85a9a;color:#fff;
  padding:16px 44px;border-radius:999px;cursor:pointer;
  font-size:1.1rem;font-family:inherit;font-weight:bold;
  transition:transform .15s, background .2s;
  box-shadow:0 6px 20px rgba(216,90,154,.35);min-height:52px;touch-action:manipulation;
}
.botao:hover{transform:scale(1.05);background:#c94a8b}
.botao:active{transform:scale(.97)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cena-gif,.gifs-row,.letra-pt,.letra-en{animation:fadeIn .5s ease both}
.letra-pt{animation-delay:.05s}
.letra-en{animation-delay:.15s}
@media (max-width:600px){
  body{padding:8px}
  .carta{min-height:calc(100dvh - 16px);border-radius:22px;padding:24px 16px 20px;gap:12px}
  .cena-gif{max-height:40dvh;border-radius:16px}
  .meme-single{max-height:45dvh;border-radius:16px}
  .gifs-row{gap:8px}
  .gifs-row img{border-radius:14px;max-height:32dvh}
  .gifs-row.tripla img{max-height:26dvh}
  .gifs-row.quadrupla img{max-height:22dvh}
  .letra-pt{font-size:clamp(1.05rem,5vw,1.4rem)}
  .letra-en{font-size:clamp(.8rem,3.4vw,1rem)}
  .botao{padding:15px 36px;font-size:1rem;min-height:50px;width:100%;max-width:280px}
}
@media (max-width:380px){
  .carta{padding:18px 12px 16px}
  .cena-gif{max-height:36dvh}
  .gifs-row img{max-height:26dvh}
  .letra-pt{font-size:1rem}
  .letra-en{font-size:.78rem}
}
@media (max-height:500px) and (orientation:landscape){
  body{padding:6px}
  .carta{min-height:calc(100dvh - 12px);padding:14px 20px;gap:8px;border-radius:16px}
  .cena-gif{max-height:52dvh}
  .gifs-row img{max-height:44dvh}
  .letra-pt{font-size:.95rem}
  .letra-en{font-size:.75rem}
  .botao{padding:12px 32px;min-height:44px;font-size:.95rem}
}
</style>
</head>
<body>

  { t:93, tipo:"cena", gifs:["gifs/a risada dela ela odeia.gif","gifs/a risada dela.gif"],

  { t:105, tipo:"cena", gifs:["gifs/nao acredita..gif","gifs/nao ha nada.gif"],

  { t:131, tipo:"cena", gifs:["gifs/jamais pediria 3.gif","gifs/eu digo todo dia 2.gif","gifs/jamais pediria.gif"],

  { t:140, tipo:"cena", gifs:["gifs/ela é tao linda.gif","gifs/feliz.gif","gifs/mundo inteiro.gif"],

    en:"'Cause, girl, you're amazing<br>Just the way you are",

  /* ===== TE AMO [2:38 – 3:33] ===== */

    pt:"Te amo ❤️", en:"", bg:"#ffe0ec", corTexto:"#b8326e" },

  { t:165, tipo:"cena", gifs:["gifs/feliz 4.gif","gifs/jamais pediria.gif","gifs/jamais pediria2.gif","gifs/jamais pediria 3.gif"],
    pt:"Te amo muito 💕", en:"", bg:"#ffd6e0", corTexto:"#a02558" },

  { t:172, tipo:"cena", gifs:["gifs/eu digo todo dia.gif","gifs/ela é tao linda.gif","gifs/tao linda.gif","gifs/todo dia.gif"],
    pt:"Te amo infinito 💖", en:"", bg:"#fff5cc", corTexto:"#a68018" },

    pt:"Te amo pra sempre 💗", en:"", bg:"#ffe0ec", corTexto:"#b8326e" },

    pt:"Te amo, meu docinho 🍬", en:"", bg:"#fff0d9", corTexto:"#8a5a1a" },

  { t:205, tipo:"cena", gifs:["gifs/jamais pediria.gif","gifs/feliz 1.gif","gifs/feliz 3.gif","gifs/feliz 4.gif"],
    pt:"❤️", en:"", bg:"#08366b", corTexto:"#ffffff" },

    bg:"#08366b", corTexto:"#ffffff"
  }
];

/* ============================================================
   ESTADO
   ============================================================ */
let atual = 0;
let musicaIniciada = false;
let audioComecou = false;
let rafId = null;
let inicioWallClock = 0;

const carta  = document.getElementById("carta");
const area   = document.getElementById("areaGatos");
const titulo = document.getElementById("titulo");
const texto  = document.getElementById("texto");
const btn    = document.getElementById("btn");
const musica = document.getElementById("musica");

try { musica.volume = 0.5; } catch(e){}

/* ============================================================
   RENDER — vários gifs juntos quando a lista tem +1
   ============================================================ */
function carregarCena(i){
  const c = cenas[i];
  if(!c) return;

  titulo.innerHTML = "";
  texto.innerHTML  = "";
  titulo.style.display = "none";
  texto.style.display  = "none";
  carta.classList.remove("carta-cena", "carta-capa");
  carta.style.background = c.bg;

  const gifs = c.gifs || [];
  const qtd  = gifs.length;

  if(c.tipo === "capa"){
    carta.classList.add("carta-capa");
    /* capa sempre mostra o primeiro gif em tamanho grande */
    area.innerHTML = `<img class="meme-single" src="${gifs[0]}" alt="">`;

    if(c.titulo){
      titulo.style.display = "";
      titulo.innerHTML = c.titulo;
      titulo.style.color = c.corTexto;
    }
    if(c.texto){
      texto.style.display = "";
      texto.innerHTML = c.texto;
      texto.style.color = c.corTexto;
    }
    if(i === 0){
      btn.style.display = "";
      btn.textContent = "▶ Começar";
    } else {
      btn.style.display = "none";
    }
  } else {
    carta.classList.add("carta-cena");

    /* escolhe o layout conforme a quantidade de gifs */
    let gifsHTML;
    if(qtd === 1){
      gifsHTML = `<img class="cena-gif" src="${gifs[0]}" alt="">`;
    } else if(qtd === 2){
      gifsHTML = `<div class="gifs-row dupla">
        ${gifs.map(g => `<img src="${g}" alt="">`).join("")}
      </div>`;
    } else if(qtd === 3){
      gifsHTML = `<div class="gifs-row tripla">
        ${gifs.map(g => `<img src="${g}" alt="">`).join("")}
      </div>`;
    } else {
      /* 4 ou mais */
      gifsHTML = `<div class="gifs-row quadrupla">
        ${gifs.map(g => `<img src="${g}" alt="">`).join("")}
      </div>`;
    }

    const temLetra = (c.pt && c.pt.trim() !== "");
    area.innerHTML = `
      ${gifsHTML}
      ${temLetra ? `<div class="letra-pt" style="color:${c.corTexto}">${c.pt}</div>` : ""}
      ${c.en ? `<div class="letra-en" style="color:${c.corTexto}">${c.en}</div>` : ""}
    `;
    btn.style.display = "none";
  }
}

/* ============================================================
   TEMPO ATUAL
   ============================================================ */
function tempoAtual(){
  if(audioComecou){
    return musica.currentTime - OFFSET;
  }
  if(inicioWallClock > 0){
    return ((performance.now() - inicioWallClock) / 1000) - OFFSET;
  }
  return 0;
}

/* ============================================================
   LOOP
   ============================================================ */
function tick(){
  if(!musicaIniciada) return;
  const tempo = tempoAtual();

  let alvo = atual;
  for(let i = 1; i < cenas.length - 1; i++){
    const c = cenas[i];
    if(typeof c.t === "number" && c.t <= tempo){
      alvo = i;
    } else {
      break;
    }
  }

  if(alvo !== atual){
    atual = alvo;
    carregarCena(atual);
  }

  rafId = requestAnimationFrame(tick);
}

musica.addEventListener("playing", () => { audioComecou = true; });

musica.addEventListener("ended", () => {
  if(rafId) cancelAnimationFrame(rafId);
  atual = cenas.length - 1;
  carregarCena(atual);
});

btn.onclick = () => {
  if(atual === 0){
    musicaIniciada = true;
    inicioWallClock = performance.now();

    atual = 1;
    carregarCena(1);
    rafId = requestAnimationFrame(tick);

    try {
      musica.volume = 0.5;
      const p = musica.play();
      if(p && p.catch) p.catch(e => console.warn("play() falhou:", e));
    } catch(e){
      console.warn("play() jogou exceção:", e);
    }
  }
};

carregarCena(0);
</script>
</body>
</html>
